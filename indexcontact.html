<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatilble" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
   <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
   <link href='https://cdn.boxicons.com/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="Css/style.css?v=4">
    <link rel="icon" href="image/image1.png.jpg" type="image/png">
    <title>Mohammed Okasha | Full-stack Developer</title>
</head>
<body>
<header class="header">
    <a href="index.html" class="logo">Mohammed<span>Okasha</span></a>
    <i class='bx bx-menu' id="menu"></i>
    <nav>
            <ul>
              <li><a href="index.html">Home</a></li>
              <li><a href="indexabout.html">About</a></li>
              <li><a href="indexservices.html">Services</a></li>
              <li><a href="indexskills.html">Skills</a></li>
              <li class="nav-contact-item"><a href="indexcontact.html" class="name1">Contact Me</a></li>
            </ul>
        </nav>
    <a href="indexcontact.html" class="btn">Contact Me</a>
</header>

<section class="contact" id="contact">
    <h2 class="heading">Contact <span>Me!</span></h2>
    <form action="#">
        <div class="input-box">
            <input type="text" placeholder="firstName" name="firstName">
            <input type="text" placeholder="fatherName" name="fatherName">
            <input type="text" placeholder="lastName" name="lastName">
            <input type="number" placeholder="age" name="age">
        </div>
        <div class="input-box">
            <input type="text" placeholder="firstName" name="firstName">
            <input type="tel" name="mobile" placeholder="mobile" pattern="[0-9]{9,}" required>
            <input type="text" placeholder="Email subject">
            <input type="email" placeholder="Email" name="email">
        </div>
        <div class="input-box11">
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female" class="female"> Female
        </div>
        <div class="input-box11">
            <select id="country" name="country" required>
                <option value="">--Select Country--</option>
                <option value="Saudi Arabia">Saudi Arabia</option>
                <option value="Egypt">Egypt</option>
                <option value="Jordan">Jordan</option>
                <option value="UAE">UAE</option>
                <option value="Morocco">Morocco</option>
                <option value="Tunisia">Tunisia</option>
                <option value="Lebanon">Lebanon</option>
                <option value="Iraq">Iraq</option>
                <option value="Kuwait">Kuwait</option>
                <option value="Oman">Oman</option>
            </select>
        </div>
        <label>Hobbies:</label>
        <div class="input-box12">
            <input type="checkbox" id="reading" name="hobbies" value="Reading">
            <label for="reading">Reading</label>
            <input type="checkbox" id="sports" name="hobbies" value="Sports">
            <label for="sports">Sports</label>
            <input type="checkbox" id="music" name="hobbies" value="Music">
            <label for="music">Music</label>
            <input type="checkbox" id="traveling" name="hobbies" value="Traveling">
            <label for="traveling">Traveling</label>
            <input type="checkbox" id="cooking" name="hobbies" value="Cooking">
            <label for="cooking">Cooking</label>
            <input type="checkbox" id="gaming" name="hobbies" value="Gaming">
            <label for="gaming">Gaming</label>
        </div>
        <div class="input-box1">
            <input type="password" placeholder="password" id="password" name="password" required>
            <input type="password" placeholder="confirmPassword" id="confirmPassword" name="confirmPassword" required>
        </div>
        <textarea name="" id="" cols="30" rows="10" placeholder="your message"></textarea>
        <a href="index.html" class="btn">Send message</a>
        <a href="index.html" class="btn">Back to Home Page</a>
    </form>
</section>

<script src="script.js?v=4"></script>
</body>
</html>
